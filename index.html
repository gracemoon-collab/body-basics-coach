<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15233b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몸 기본기">
<title>몸 기본기 코치 · 시제품 v0.3</title>
<style>
:root{--navy:#15233b;--blue:#356ee6;--blue-soft:#edf3ff;--ink:#18202c;--muted:#6f7886;--line:#e8ebf0;--bg:#f6f7f9;--card:#fff;--green:#1f9d63;--green-soft:#e6f6ee;--amber:#b7791f;--amber-soft:#fdf4e3;--red:#c94545;--red-soft:#fbeaea;--violet:#6b4fd8;--violet-soft:#f1edfd;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:580px;margin:0 auto;padding:18px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px;gap:8px}
header h1{font-size:19px;margin:0;letter-spacing:-.02em}
header .ver{font-size:12px;color:var(--muted);text-align:right}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;border:1px solid var(--line)}
h2{font-size:18px;margin:0 0 6px;letter-spacing:-.02em}
h3{font-size:15px;margin:16px 0 8px}
h3:first-child{margin-top:0}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px;color:var(--muted)}
label.q{display:block;font-weight:600;margin:18px 0 8px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;user-select:none;color:var(--ink);line-height:1.35}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
input[type=number]{width:100%;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label.q{margin-top:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:600;background:var(--navy);color:#fff;cursor:pointer;margin-top:18px}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);margin-top:10px}
.btn.blue{background:var(--blue)}
.steps{display:flex;gap:5px;margin-bottom:14px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--blue)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;margin:3px 4px 3px 0}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .s{font-size:12px;color:var(--muted)}
.stagebar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0 4px}
.stagebar div{text-align:center;font-size:11px;color:var(--muted);padding-top:8px;border-top:4px solid var(--line)}
.stagebar div.done{border-color:#9db8f2}
.stagebar div.cur{border-color:var(--blue);color:var(--ink);font-weight:700}
ul.plan{padding-left:18px;margin:6px 0}
ul.plan li{margin:4px 0}
.vid{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.vid:first-of-type{border-top:0}
.vid img{width:108px;height:61px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.vid .t{font-size:14px;font-weight:600;line-height:1.35}
.vid .m{font-size:12px;color:var(--muted);margin-top:3px}
.vid .c{font-size:12px;color:var(--amber);margin-top:3px}
.note{background:var(--amber-soft);border-radius:10px;padding:12px;font-size:14px;margin-top:10px}
.info{background:var(--blue-soft);border-radius:10px;padding:12px;font-size:14px;margin-top:10px}
.supp{background:var(--violet-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;color:#4a3a8f}
.stop{background:var(--red-soft);border-radius:10px;padding:14px;font-size:15px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row b{font-variant-numeric:tabular-nums}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
.tabbar button{flex:1;max-width:120px;border:0;background:none;font-size:13px;color:var(--muted);padding:9px 4px;cursor:pointer}
.tabbar button.on{color:var(--navy);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.seg span{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:#fff}
.seg span.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sasang{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.sasang .opts{flex-wrap:nowrap;gap:4px}
.sasang .chip{padding:6px 9px;font-size:12.5px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--violet)}
details{margin-top:8px}
summary{cursor:pointer;font-size:14px;color:var(--blue)}
.hist{font-size:13px;border-top:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;gap:8px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.sasang{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header><h1>몸 기본기 코치</h1><span class="ver">시제품 v0.3<br>기록은 이 기기에만 저장</span></header>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar">
  <button data-tab="home">요약</button>
  <button data-tab="diet">식단</button>
  <button data-tab="move">운동</button>
  <button data-tab="checkin">체크인</button>
  <button data-tab="check">사전조사</button>
</nav>
<script>
/* ==================================================================
   데이터: 맞춤운동식단 데이터셋 v0.5 (근거·출처는 데이터셋 09_출처, 20~24 시트)
   「보완」= 공식 기준이 없어 실무값을 쓰거나 근거가 약한 부분
   ================================================================== */
const STAGES={
 S1:{name:'기본 다지기',dur:'2–4주',goal:'긴장을 풀고 움직임 범위와 정렬 감각을 되찾아요',plan:['매일 이완·가동성 10분','걷기 주 3–5회, 20–30분','쉬운 근력 주 2회, 15분'],next:'최소 2주, 주 3회 이상을 2주 연속 + 다음날 통증 악화 없음'},
 S2:{name:'안정화·기초 근력',dur:'4–6주',goal:'맨몸 기본 6패턴을 바른 자세로 해요',plan:['근력 주 2–3회, 30분 (가동성 워밍업 5–10분 포함)','6패턴: 스쿼트 · 엉덩이 들기 · 밀기 · 당기기(밴드) · 코어 버티기 · 한발 균형','유산소를 주 150분 쪽으로 조금씩'],next:'최소 4주, 6패턴 각 2세트×10–12회를 다음날 악화 없이 + 의자 일어서기 기준선 +2회'},
 S3:{name:'근력 강화',dur:'6–12주',goal:'부하를 조금씩 올려 근력과 근육을 늘려요',plan:['근력 주 2–4회 (덤벨·밴드)','목표 반복보다 1–2회 더 되면 무게를 2–10% 올리기','유산소 주 150–300분, 인터벌은 선택'],next:'8주 이상 꾸준히 + 부하 증가 기록'},
 S4:{name:'목표별 심화·유지',dur:'지속',goal:'우선 목표에 맞추고, 최소 유지량은 지켜요',plan:['근력 주 2회 이상 + 활동 주 150분 이상 유지','8–12주마다 사전조사 다시 하기'],next:'-'}
};
const NEEDS={N2:{name:'이완·회복',cls:'b-blue',why:'뻐근함이 잦거나 잠·스트레스 회복이 필요해요'},N3:{name:'가동성',cls:'b-blue',why:'움직임 범위가 좁거나 좌우 차이가 있어요'},N4:{name:'정렬·조절',cls:'b-blue',why:'동작 중 보상이나 균형 흔들림이 보여요'},N5:{name:'근력·근지구력',cls:'b-green',why:'근력 기초가 필요해요'},N6:{name:'심폐체력',cls:'b-green',why:'빠르게 걸을 때 숨이 쉽게 차요'},N7:{name:'체지방 관리',cls:'b-amber',why:'체지방이나 허리 기준이 높거나 목표로 고르셨어요'}};

/* 체형 유형 (데이터셋 20_체형유형) */
const BODY_TYPES={
 skinnyfat:{name:'마른 비만형',desc:'체중은 정상 범위인데 체지방 비율이 높은 편이에요.',ex:'근력운동 주 2–3회가 1순위, 유산소는 보조',diet:'체중을 크게 줄이기보다 유지~소폭 적자에서 단백질을 충분히',kcal:'recomp'},
 sarcoobese:{name:'근감소성 비만 의심형',desc:'체지방은 높고 근육은 적은 편이에요. 근력·기능 확인이 필요해요.',ex:'근력운동이 최우선, 유산소 병행',diet:'완만한 감량 + 충분한 단백질, 급감량 금지',kcal:'lose',warn:'악력·의자 일어서기 같은 기능 확인과 전문가 상담을 권해요.'},
 fatexcess:{name:'체지방 과다형',desc:'근육은 적당한데 체지방이 많은 편이에요.',ex:'유산소 + 근력 병행',diet:'완만한 열량 적자 + 충분한 단백질',kcal:'lose'},
 bothhigh:{name:'근육·지방 모두 많은형',desc:'근육량도 많고 체지방도 높은 편이에요.',ex:'근력은 유지하고 유산소 비중을 늘리기',diet:'완만한 열량 적자, 단백질 유지',kcal:'lose'},
 muscular:{name:'근육형',desc:'체중이 높아 보여도 근육이 많고 체지방은 표준 이하예요.',ex:'목적에 맞는 근력·체력 유지',diet:'활동량에 맞는 열량 유지',kcal:'keep'},
 overstd:{name:'과체중 표준형',desc:'체중은 높은 편이지만 체지방·근육은 표준 범위예요.',ex:'유산소 + 근력 균형',diet:'유지 또는 아주 완만한 적자',kcal:'keep'},
 standard:{name:'표준형',desc:'체중·체지방·근육이 고른 편이에요.',ex:'기본기 유지와 목표별 보완',diet:'유지 열량, 식사 질 높이기',kcal:'keep'},
 weakstd:{name:'근력 부족 표준형',desc:'체중·체지방은 표준인데 근육이 적은 편이에요.',ex:'근력운동 우선',diet:'유지~소폭 잉여 + 단백질 충분히',kcal:'gain'},
 lean:{name:'마른형',desc:'체중이나 체지방이 낮고 근육도 적은 편이에요.',ex:'근력운동 우선 + 충분한 회복',diet:'감량 금지, 유지~소폭 잉여 + 단백질',kcal:'gain',warn:'의도하지 않은 체중 감소나 어지럼이 있으면 진료를 먼저 받아 주세요.'},
 athletic:{name:'슬림 근육형',desc:'체지방은 낮고 근육은 표준 이상이에요.',ex:'목표별 근력·체력 유지',diet:'활동량에 맞는 열량 유지',kcal:'keep'},
 unknown:{name:'체형 판정 보류',desc:'체지방과 근육 자료가 부족해 세부 유형을 정하지 않았어요.',ex:'기초 움직임과 근력부터 확인',diet:'규칙적인 균형식부터 시작',kcal:'keep'}
};

/* 식사 반응 특성 (데이터셋 22_식사반응특성) */
const TRAITS={
 oily:{label:'기름진 음식 먹으면 더부룩하거나 불편',tip:'튀김·삼겹살·크림 요리는 양을 줄이고 굽기·찌기·삶기로. 한 번에 많이 먹지 말고 천천히, 자기 3시간 전엔 식사 마무리.',flag:'기름진 식사 뒤 명치·오른쪽 윗배 통증이 30분 이상 가거나 등·어깨로 뻗치면 진료(담낭 확인).',ev:'B'},
 cold:{label:'찬 음식·찬 음료 먹으면 속이 불편',tip:'불편하면 물·음료를 미지근하게 바꿔 비교 기록해 보세요. 식사 중 물은 조금씩.',flag:'',ev:'C',supp:'찬 음식이 원인이라는 현대 근거는 약해요(소화불량 환자 대상 소규모 연구). 한의학의 "속이 차다"는 전통 해석이에요.'},
 heat:{label:'몸에 열이 많고 더위를 많이 탐·땀이 많음',tip:'식단으로 열을 내린다는 근거는 없어요. 수분을 충분히, 카페인·술·매운 음식과의 관계를 기록해 보세요.',flag:'더위를 못 참고 땀이 늘면서 체중이 빠지고 두근거림·손떨림이 있으면 갑상선 검사를 권해요.',ev:'경고신호만'},
 chill:{label:'추위를 많이 타고 손발이 참',tip:'끼니를 거르지 말고 충분한 에너지·단백질을 유지하세요. 극단적인 식사 제한은 피해요.',flag:'추위와 함께 피로·체중 증가·변비·피부 건조가 여러 개면 갑상선 검사를 권해요.',ev:'경고신호만'},
 slow:{label:'소화가 느리고 잘 체함·식후 오래 더부룩',tip:'세 끼를 규칙적으로, 양은 조금 적게 + 필요하면 간식. 꼭꼭 씹고 식후 바로 눕지 말고 가볍게 걷기. 채소는 익혀서.',flag:'식후 구토, 금방 배부름이 반복되며 체중이 줄거나, 삼키기 어렵거나 검은 변이면 진료.',ev:'B'},
 reflux:{label:'속쓰림·신물 올라옴',tip:'자기 2–3시간 전엔 먹지 않기, 과식 피하기, 체중이 많다면 감량. 커피·초콜릿·탄산·매운 것·고지방은 나에게 유발되는지 기록 후 그것만 줄이기.',flag:'삼킬 때 통증·체중 감소·반복 구토·검은 변·가슴 통증, 주 2회 이상 계속되면 진료.',ev:'A'},
 constip:{label:'변비 (주 3회 미만, 딱딱한 변)',tip:'채소·통곡·과일로 섬유를 몇 주에 걸쳐 천천히 늘리고 물을 함께. 식후 걷기, 아침 식후 화장실 시간 만들기.',flag:'변 습관이 갑자기 바뀜, 혈변, 원인 모를 체중 감소, 빈혈이면 진료.',ev:'A~B'},
 diarrhea:{label:'묽은 변이 잦음',tip:'커피·유제품·단 음료·무설탕 껌(감미료)·밀가루와의 관계를 기록해 보세요. 수분 보충.',flag:'4주 넘게 지속, 혈변, 밤에도 설사, 체중 감소면 진료.',ev:'B'},
 dairy:{label:'우유·아이스크림 먹으면 가스·복통',tip:'한국 성인은 유당불내가 흔해요. 락토프리 우유, 요거트·치즈를 소량부터, 식사와 함께. 칼슘·단백질은 다른 음식으로 채우기.',flag:'두드러기·호흡곤란은 알레르기 응급.',ev:'A~B'},

function analyze(a){

 const needs=needsOf(a,bc);
 const recoveryFirst=!nu.protected&&(a.sleep==='5'||a.stress==='5'||+a.stiff>=6);

}

const PAIN_KO={neck:'목',shoulder:'어깨',back:'허리',hip:'고관절',knee:'무릎',wrist:'손목'};
function recGoals(r,p){
 const a=S.answers,g=[];
 g.push(p==='ed'?['규칙적으로 먹기','세 끼를 비슷한 시간에 먹은 날 주 5일 이상']:['식사 시간 지키기','식사 시간을 비슷하게 지킨 날 주 5일 이상']);
 g.push(['몸 풀기','스트레칭·호흡 10분, 주 4일 이상 (아프면 줄이고 쉬어도 돼요)']);
 if(a.sleep==='5') g.push(['잠 지키기','잠드는 시각과 일어나는 시각을 정해 두고 6–7시간을 목표로 해요. 자기 전 화면은 줄여요']);
 else if(a.stress==='5'||+a.stiff>=4) g.push(['긴장 낮추기','하루 한 번, 숨을 길게 내쉬는 호흡 3–5분. 숨은 참지 않고 어지러우면 멈춰요']);
 else g.push(['몸 상태 적기','하루 한 번 몸이 얼마나 편한지 0–10으로 적어요']);
 const pains=(a.painArea||[]).filter(x=>x!=='none').map(x=>PAIN_KO[x]);
 if(pains.length) g.push(['아픈 부위 지키기',pains.join('·')+'은 통증 없는 범위에서만 움직이고, 통증이 커지면 멈춰요']);
 if(r.flags.includes('syncope')) g.push(['어지럼 예방','일어날 때 천천히, 공복에는 스트레칭을 하지 않고 숨 참지 않기']);

function recVideos(r,p){
 const R=REC[p],tierW={P:3,H:3,E:2,C:1};
 if(p==='pregnant') return [];
 const bad=/뱃살|다이어트|체지방|칼로리|지방 ?연소|살 ?빼/;
 const list=VIDEOS.filter(v=>R.stretchCats.includes(v.cat)&&v.st.includes('S1')&&v.imp==='저'&&!v.avoid.some(x=>r.flags.includes(x))&&!(p==='pregnant'&&v.avoid.includes('pregnant'))&&!bad.test(v.t)&&v.min<=20)
  .map(v=>({...v,score:v.nd.filter(x=>x==='N2'||x==='N3'||(r.needs.includes(x)&&x!=='N7')).length*2+tierW[v.tier]}))
  .sort((x,y)=>y.score-x.score);
 const out=[],used={};for(const v of list){if((used[v.ch]||0)>=2)continue;out.push(v);used[v.ch]=(used[v.ch]||0)+1;if(out.length>=5)break;}
 return out;
}

function proteinPlan(target,a){

 if(a.style==='ovo') ban.add('meat'),ban.add('fish'),ban.add('shell');
 if(a.style==='vegan') ['meat','fish','shell','egg','dairy'].forEach(x=>ban.add(x));
 const pool=PROTEIN_FOODS.filter(f=>!f.tag.some(t=>ban.has(t)));
 const pick=[];let sum=0;const seenTag={};
 for(const f of [...pool].sort((x,y)=>y.g-x.g)){if(sum>=target) break;const t=f.tag[0];if((seenTag[t]||0)>=1&&pool.length>4) continue;pick.push(f);sum+=f.g;seenTag[t]=(seenTag[t]||0)+1;}
 if(sum<target) for(const f of pool){if(sum>=target) break;pick.push(f);sum+=f.g;}
 return {pick,sum};
}

  const entry={date:today(),week:weekKey(today()),stage:S.stage,days:a.days,worse:a.worse,food:a.food,w:wNow,six:a.six||null,load:a.load||null,chair:chairNow};

  if(same>=0) S.checkins[same]=entry; else S.checkins=[...(S.checkins||[]),entry];
  const currentStage=S.stage, elapsed=daysBetween(S.stageStart,today());
  const prev=S.checkins.filter(c=>c.stage===currentStage&&new Date(c.date)>=new Date(S.stageStart)).sort((x,y)=>x.date.localeCompare(y.date));
  const last2=prev.slice(-2), twoWeeks=last2.length===2&&last2[0].week!==last2[1].week&&daysBetween(last2[0].date,last2[1].date)>=6;
  const ok2=twoWeeks&&last2.every(c=>(c.days==='5+'?5:+c.days)>=3&&c.worse==='no');
  let msg='';
  if(a.worse==='yes') msg='다음날 통증이 심해졌다면 이번 주는 운동량을 절반쯤으로 줄여요. 저림이 생기거나 계속 심해지면 진료를 먼저 받아 주세요.';
  else if(twoWeeks&&last2.every(c=>(c.days==='5+'?5:+c.days)<=1)&&S.stage!=='S1'){S.stage={S4:'S3',S3:'S2',S2:'S1'}[S.stage];S.stageStart=today();msg=`두 주 동안 운동이 거의 없었으니 ${S.stage}로 한 단계 내려가 가볍게 다시 시작해요.`;}
  else if(S.stage==='S1'&&ok2&&elapsed>=14){S.stage='S2';S.stageStart=today();msg='서로 다른 두 주에 꾸준했고 통증 악화도 없었어요. S2 안정화·기초 근력으로 넘어가요.';}
  else if(S.stage==='S2'&&ok2&&elapsed>=28&&a.six==='yes'){
   const base=num(S.baseline?.chair);
   if(base==null||chairNow==null) msg='기본 동작은 안정됐어요. 다만 의자 일어서기 시작값과 이번 값이 모두 있어야 다음 단계로 넘어가요.';
   else if(chairNow-base>=2){S.stage='S3';S.stageStart=today();msg='기본 6동작과 기능 지표가 좋아졌어요. S3 근력 강화로 넘어가요.';}
   else msg='동작은 안정됐어요. 의자 일어서기가 처음보다 2회 이상 늘면 다음 단계로 가요.';
  }
  else if(S.stage==='S3'&&ok2&&elapsed>=56&&a.load==='yes'){S.stage='S4';S.stageStart=today();msg='8주 이상 꾸준했고 실제 부하도 늘었어요. S4 목표별 심화·유지로 넘어가요.';}
  else msg=`좋아요, 지금 단계를 이어가요. 다음 기준: ${STAGES[S.stage].next}`;
  const foodWeeks=S.checkins.filter(c=>c.food==='5–7'&&new Date(c.date)>=new Date(S.habitStart)).sort((x,y)=>x.date.localeCompare(y.date));
  const f2=foodWeeks.slice(-2);
  if(f2.length===2&&weekKey(f2[0].date)!==weekKey(f2[1].date)&&daysBetween(S.habitStart,today())>=14&&(S.habit||0)<r.ladder.length-1){S.habit=(S.habit||0)+1;S.habitStart=today();msg+=` 식단 습관도 서로 다른 두 주에 잘 지켜서 다음 습관 「${r.ladder[S.habit].name}」으로 넘어가요.`;}
  const ws=S.checkins.filter(c=>c.w).sort((x,y)=>x.date.localeCompare(y.date)).slice(-3);
  if(ws.length>=2&&r.nu.mode==='lose'){
   const days=Math.max(1,daysBetween(ws[0].date,ws[ws.length-1].date)),kgWeek=(ws[0].w-ws[ws.length-1].w)*7/days;
   if(kgWeek>num(S.answers.w)*0.01) msg+=' 최근 감량 속도가 주 1%를 넘어요. 근손실·어지럼이 생기지 않게 식사량을 조금 늘리고 상태를 확인하세요.';
   else if(days>=14&&kgWeek<=0) msg+=' 2주 이상 체중 변화가 없다면 하루 100–200kcal만 조정하거나 걷기를 조금 늘려 보세요.';
  }
  save(S);$('ciOut').innerHTML=`<div class="note" style="margin-top:14px">${msg}</div>`;
 };
}
render();
</script>
